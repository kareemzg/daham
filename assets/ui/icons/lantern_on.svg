<!--
  فانوس مشتعل. The same five pieces the icon has always had — a ring handle, a
  slanted cap, a round-cornered glass, a gleam inside it, a base — in a box of
  twice the resolution at the same 2 : 3 the HUD lays out.

  The glass lights from the INSIDE: a radial from a cream core out to gold at
  the rim, not a top-to-bottom ramp. That is the one change that carries the
  small sizes — at 24px what reads is a bright point inside a gold box, where a
  ramp read as one gold smudge. The edge is dark bronze and not olive, because
  the lantern chip's face is copper and an olive edge dissolves into it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <radialGradient id="glass" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#FFF8E4"/>
      <stop offset="0.42" stop-color="#FFD96B"/>
      <stop offset="1" stop-color="#DFA212"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD35C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFD35C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="55" r="30" fill="url(#glow)"/>
  <path d="M24 15 C24 4 40 4 40 15" fill="none" stroke="#4A3208" stroke-width="5" stroke-linecap="round"/>
  <path d="M14 19 h36 l-4 13 h-28 Z" fill="#4A3208"/>
  <rect x="11" y="32" width="42" height="46" rx="10" fill="url(#glass)" stroke="#4A3208" stroke-width="4"/>
  <rect x="18" y="41" width="8" height="20" rx="4" fill="#FFF8E4" fill-opacity="0.72"/>
  <rect x="14" y="77" width="36" height="11" rx="5" fill="#4A3208"/>
</svg>
