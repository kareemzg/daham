<!--
  فانوس منطفئ. The same geometry as `lantern_on.svg`, dark rather than grey.

  A spent lantern used to be a pale grey one, so it differed from a lit one in
  hue alone — the weakest difference there is, and it vanished entirely on the
  copper chip where five of them sit side by side. Dark differs in LIGHTNESS,
  which survives any size. No gleam and no halo: there is no light in it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3B4C"/>
      <stop offset="1" stop-color="#1E2734"/>
    </linearGradient>
  </defs>
  <path d="M24 15 C24 4 40 4 40 15" fill="none" stroke="#1A2430" stroke-width="5" stroke-linecap="round"/>
  <path d="M14 19 h36 l-4 13 h-28 Z" fill="#1A2430"/>
  <rect x="11" y="32" width="42" height="46" rx="10" fill="url(#glass)" stroke="#1A2430" stroke-width="4"/>
  <rect x="14" y="77" width="36" height="11" rx="5" fill="#1A2430"/>
</svg>
